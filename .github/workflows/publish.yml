name: Publish to npm

# Runs only when a version tag is pushed, so ordinary pushes cost no
# Actions minutes. Publishing uses npm trusted publishing (OIDC), so there
# is no npm token secret in this repository.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository_owner == 'Reality-Software-Entertainment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm test

      - name: Tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $expected"
            exit 1
          fi

      - name: Skip when this version is already on npm
        id: published
        run: |
          n=$(node -p "require('./package.json').name")
          v=$(node -p "require('./package.json').version")
          if npm view "$n@$v" version >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - run: npm publish --provenance --access public
        if: steps.published.outputs.skip != 'true'
