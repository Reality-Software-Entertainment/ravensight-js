name: CI

# Nightly on weekdays and on demand, never on a push or a pull request
# (owner decision, November 19, 2026). Changes are checked locally first by
# the pre-push hook in .githooks; this run is the safety net behind it, and
# a night when main has not moved since the last green run costs one short job.
on:
  schedule:
    - cron: '25 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quiet:
    # A scheduled run on a main that already passed is skipped; a dispatch always runs.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          wf=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?event=schedule&status=success&branch=main&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "main is unchanged since the last green nightly ($last)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: quiet
    if: needs.quiet.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # pretest regenerates dist/index.cjs, and the tests load it with require.
      - run: npm test

      - name: Committed CommonJS build is current
        run: |
          npm run build
          if ! git diff --exit-code -- dist; then
            echo "dist/index.cjs is stale: run npm run build and commit it"
            exit 1
          fi

      - name: Package contents
        run: npm pack --dry-run
